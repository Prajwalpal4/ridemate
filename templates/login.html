<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-blue-50 min-h-screen flex items-center justify-center">

<div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-8">

<h1 class="text-4xl font-bold text-center text-blue-600">
RideMate
</h1>

<p class="text-center text-gray-500 mt-2">

Login to continue

</p>

{% with messages = get_flashed_messages() %}
{% if messages %}
{% for message in messages %}

<div class="bg-red-100 text-red-700 p-3 rounded mt-5">

{{ message }}

</div>

{% endfor %}
{% endif %}
{% endwith %}

<form method="POST" class="mt-8">

<input
type="email"
name="email"
placeholder="College Email"
required
class="w-full border rounded-lg p-3 mb-4">

<input
type="password"
name="password"
placeholder="Password"
required
class="w-full border rounded-lg p-3 mb-6">

<button
class="w-full bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700">

Login

</button>

</form>

<div class="text-center mt-6">

Don't have an account?

<a href="/register"
class="text-blue-600 font-bold">

Register

</a>

</div>

</div>

</body>
</html>
