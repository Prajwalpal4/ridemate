{% extends "layouts/base.html" %}
{% block page_title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto mt-16 bg-white rounded-2xl shadow p-10 text-center">
    <div class="text-6xl font-extrabold text-blue-600">{{ code }}</div>
    <p class="mt-4 text-gray-600">{{ message }}</p>
    <a href="/dashboard" class="inline-block mt-8 bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-semibold">Go to Dashboard</a>
</div>
{% endblock %}
