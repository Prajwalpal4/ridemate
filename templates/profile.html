{% extends "layouts/base.html" %}

{% block page_title %}
Profile
{% endblock %}

{% block content %}

<div class="max-w-4xl mx-auto">

    <div class="bg-white rounded-2xl shadow-md overflow-hidden">

        <!-- Profile Header -->

        <div class="bg-blue-700 p-8 text-white">

            <div class="flex items-center gap-5">

                <div class="w-20 h-20 bg-white text-blue-700 rounded-full flex items-center justify-center text-3xl font-bold">

                    {{ user.full_name[0]|upper }}

                </div>

                <div>

                    <h1 class="text-3xl font-bold">
                        {{ user.full_name }}
                    </h1>

                    <p class="text-blue-200 mt-1">
                        {{ user.role }}
                    </p>

                </div>

            </div>

        </div>


        <!-- Profile Information -->

        <form method="POST" class="p-8">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <h2 class="text-xl font-bold text-gray-800 mb-6">
                Personal Information
            </h2>


            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">


                <!-- Full Name - READ ONLY -->

                <div>

                    <label class="block text-sm font-semibold text-gray-600 mb-2">
                        Full Name
                    </label>

                    <div class="relative">

                        <i class="fas fa-user absolute left-4 top-4 text-gray-400"></i>

                        <input
                            type="text"
                            value="{{ user.full_name }}"
                            disabled
                            class="w-full bg-gray-100 border border-gray-200 rounded-xl py-3 pl-11 pr-4 text-gray-600"
                        >

                    </div>

                </div>


                <!-- Email - READ ONLY -->

                <div>

                    <label class="block text-sm font-semibold text-gray-600 mb-2">
                        Email
                    </label>

                    <div class="relative">

                        <i class="fas fa-envelope absolute left-4 top-4 text-gray-400"></i>

                        <input
                            type="email"
                            value="{{ user.email }}"
                            disabled
                            class="w-full bg-gray-100 border border-gray-200 rounded-xl py-3 pl-11 pr-4 text-gray-600"
                        >

                    </div>

                </div>


                <!-- Department - READ ONLY -->

                <div>

                    <label class="block text-sm font-semibold text-gray-600 mb-2">
                        Department
                    </label>

                    <div class="relative">

                        <i class="fas fa-building absolute left-4 top-4 text-gray-400"></i>

                        <input
                            type="text"
                            value="{{ user.department }}"
                            disabled
                            class="w-full bg-gray-100 border border-gray-200 rounded-xl py-3 pl-11 pr-4 text-gray-600"
                        >

                    </div>

                </div>


                <!-- Role - READ ONLY -->

                <div>

                    <label class="block text-sm font-semibold text-gray-600 mb-2">
                        Role
                    </label>

                    <div class="relative">

                        <i class="fas fa-id-badge absolute left-4 top-4 text-gray-400"></i>

                        <input
                            type="text"
                            value="{{ user.role }}"
                            disabled
                            class="w-full bg-gray-100 border border-gray-200 rounded-xl py-3 pl-11 pr-4 text-gray-600"
                        >

                    </div>

                </div>


                <!-- Vehicle Number - EDITABLE -->

                <div class="md:col-span-2">

                    <label class="block text-sm font-semibold text-gray-600 mb-2">

                        Vehicle Number

                    </label>

                    <div class="relative">

                        <i class="fas fa-car absolute left-4 top-4 text-blue-600"></i>

                        <input
                            type="text"
                            name="vehicle_number"
                            value="{{ user.vehicle_number or '' }}"
                            placeholder="Enter vehicle number"
                            class="w-full border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 rounded-xl py-3 pl-11 pr-4 outline-none"
                        >

                    </div>

                    <p class="text-sm text-gray-500 mt-2">
                        You can update your vehicle number here.
                    </p>

                </div>

            </div>


            <!-- Save Button -->

            <div class="flex justify-end mt-8">

                <button
                    type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-7 py-3 rounded-xl font-semibold transition"
                >

                    <i class="fas fa-save mr-2"></i>

                    Save Vehicle Number

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
